<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#101114">
  <title>Obby</title>
  <link rel="shortcut icon" href="https://cdn.jsdelivr.net/gh/papamamia/sers@main/TemplateData/favicon.ico">
  <style>
    :root {
      color-scheme: dark;
      background: #101114;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      min-height: 100%;
      margin: 0;
      overflow: hidden;
      background: #101114;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-text-size-adjust: 100%;
    }

    #unity-container {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      width: 100%;
      height: 100dvh;
      min-height: 100svh;
      overflow: hidden;
      touch-action: none;
    }

    #unity-canvas {
      display: block;
      width: 100%;
      height: 100%;
      max-width: 100vw;
      max-height: 100dvh;
      margin: 0;
      outline: none;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    #unity-loading-bar {
      position: fixed;
      top: 50%;
      left: 50%;
      width: min(320px, calc(100vw - 40px));
      transform: translate(-50%, -50%);
      z-index: 1;
    }

    #unity-progress-bar-empty {
      width: 100%;
      height: 6px;
      overflow: hidden;
      background: #303238;
      border-radius: 3px;
    }

    #unity-progress-bar-full {
      width: 0;
      height: 100%;
      background: #f2f2f2;
      transition: width 120ms linear;
    }

    @media (orientation: landscape) and (max-height: 520px) {
      #unity-canvas {
        height: 100svh;
      }
    }
  </style>
</head>
<body>
  <main id="unity-container" aria-label="Obby game">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="unity-loading-bar" style="display: none;" aria-hidden="true">
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/gh/papamamia/sers@main/Build/cee3bfd5589651a8b16e2a12b8abe5b3.loader.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/papamamia/sers@main/unityApp.js"></script>
  <script>
    (function () {
      const canvas = document.getElementById('unity-canvas');

      function resizeCanvas() {
        canvas.style.width = window.innerWidth + 'px';
        canvas.style.height = window.innerHeight + 'px';
      }

      window.addEventListener('resize', resizeCanvas, { passive: true });
      window.addEventListener('orientationchange', resizeCanvas, { passive: true });
      document.addEventListener('contextmenu', function (event) {
        event.preventDefault();
      });
      document.addEventListener('gesturestart', function (event) {
        event.preventDefault();
      }, { passive: false });

      resizeCanvas();
    })();
  </script>
</body>
</html>
